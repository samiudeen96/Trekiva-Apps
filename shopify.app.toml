# This file stores configurations for your Shopify app.
name = "Trekiva Discount"
client_id = "3d65bcc4cd60dafcad278e2aeb663931"
application_url = "https://discount.trekiva.in"
embedded = true

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_customers,write_customers,read_discounts,write_discounts"

[webhooks]
api_version = "2026-10"

  # Handled by: /app/routes/webhooks.app.uninstalled.tsx
  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = ["app/uninstalled"]

  # Handled by: /app/routes/webhooks.app.scopes_update.tsx
  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

  # Mandatory compliance topic for public apps only
  # See: https://shopify.dev/docs/apps/build/privacy-law-compliance
  [[webhooks.subscriptions]]
  uri = "/webhooks/customers/data_request"
  compliance_topics = ["customers/data_request"]

  [[webhooks.subscriptions]]
  uri = "/webhooks/customers/redact"
  compliance_topics = ["customers/redact"]

  [[webhooks.subscriptions]]
  uri = "/webhooks/shop/redact"
  compliance_topics = ["shop/redact"]

[auth]
redirect_urls = ["https://discount.trekiva.in/auth/callback"]

# Storefront requests go through the app proxy (signed by Shopify, same-origin, no CORS).
# https://<shop>/apps/trekiva/*  ->  <app url>/api/public/*
[app_proxy]
url = "https://discount.trekiva.in/api/public"
subpath = "trekiva"
prefix = "apps"