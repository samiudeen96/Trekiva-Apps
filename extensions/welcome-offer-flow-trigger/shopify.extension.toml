[[extensions]]
name = "Welcome Offer Claimed"
type = "flow_trigger"
handle = "welcome-offer-claimed"
description = "Fires once when a customer claims a Trekiva welcome offer for the first time. Never fires for repeat submissions."

[settings]

  # Payload key: customer_id (numeric Shopify customer ID)
  [[settings.fields]]
  type = "customer_reference"

  [[settings.fields]]
  type = "single_line_text_field"
  key = "CustomerEmail"

  [[settings.fields]]
  type = "single_line_text_field"
  key = "CampaignName"

  [[settings.fields]]
  type = "single_line_text_field"
  key = "DiscountCode"

  # ISO-8601 timestamp
  [[settings.fields]]
  type = "single_line_text_field"
  key = "ClaimedAt"
