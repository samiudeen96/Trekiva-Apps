# Production stack: nginx (TLS) -> trekiva-app -> postgres.
# PostgreSQL is only reachable on the internal "backend" network: it publishes no ports.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    volumes:
      - trekiva_pgdata:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  trekiva-app:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      SHOPIFY_API_KEY: ${SHOPIFY_API_KEY:?}
      SHOPIFY_API_SECRET: ${SHOPIFY_API_SECRET:?}
      SHOPIFY_APP_URL: ${SHOPIFY_APP_URL:?}
      SCOPES: ${SCOPES:-read_customers,write_customers,read_discounts,write_discounts}
      # Use a URL-safe POSTGRES_PASSWORD (e.g. `openssl rand -hex 24`).
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CLAIM_RATE_LIMIT_PER_MIN: ${CLAIM_RATE_LIMIT_PER_MIN:-10}
      RESEND_API_KEY: ${RESEND_API_KEY:?set RESEND_API_KEY in .env}
      EMAIL_FROM: ${EMAIL_FROM:?set EMAIL_FROM in .env}
      EMAIL_REPLY_TO: ${EMAIL_REPLY_TO:-}
      PORT: "3000"
    # Not published by default (nginx reaches it internally). On Elestio's managed proxy
    # set APP_BIND (see docs/DEPLOYMENT.md) and start without the nginx service.
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-3000}:3000"
    networks: [backend, edge]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - trekiva-app
    environment:
      SERVER_NAME: ${SERVER_NAME:?set SERVER_NAME (e.g. trekiva-app.example.com)}
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
      # fullchain.pem + privkey.pem for SERVER_NAME
      - ${TLS_CERT_DIR:-./deploy/certs}:/etc/nginx/certs:ro
      - ./deploy/acme:/var/www/acme:ro
    networks: [edge]

networks:
  # internal: containers on it have no route to the internet or the host.
  backend:
    internal: true
  edge: {}

volumes:
  trekiva_pgdata:
